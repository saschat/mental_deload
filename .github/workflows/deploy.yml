name: "Build and deploy to GitHub Pages"
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Build Vue app
        env:
          # App ID from cloud.bzr.dev/developers. Accept either the repository
          # variable or the repository secret named BAZAAR_APP_ID (Settings →
          # Secrets and variables → Actions). Secrets are not visible as vars.
          VITE_APP_ID: ${{ vars.BAZAAR_APP_ID || secrets.BAZAAR_APP_ID }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$VITE_APP_ID" ]; then
            echo "VITE_APP_ID is empty. Set the BAZAAR_APP_ID repository secret or variable."
            exit 1
          fi
          if [ "$VITE_APP_ID" = "test" ]; then
            echo "VITE_APP_ID is the placeholder test. Set BAZAAR_APP_ID to the real app id."
            exit 1
          fi
          echo "VITE_APP_ID is a non-test value (length ${#VITE_APP_ID})"
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
